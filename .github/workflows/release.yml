name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (must already exist on origin, e.g. v0.3.4)"
        required: true

# Never cancel a release mid-publish: a half-finished publish leaves the
# GitHub release / npm / crates.io in an inconsistent state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# On tag-triggered runs github.ref_name is the just-pushed tag. On
# workflow_dispatch runs we use the supplied tag input so a re-publish
# after a transient registry outage can retry from the existing tag.
jobs:
  build-release:
    name: build-release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oly
            asset_name: oly-linux-amd64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oly
            asset_name: oly-macos-arm64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: oly.exe
            asset_name: oly-windows-amd64.zip

    env:
      EFFECTIVE_REF: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EFFECTIVE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-oly-release
          cache-on-failure: true

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.EFFECTIVE_REF }}"
          VERSION="${VERSION#v}"
          CURRENT="$(grep -E '^version = "[^"]+"' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$CURRENT" != "$VERSION" ]; then
            sed -i -E "0,/^version = \"[^\"]+\"/{s//version = \"$VERSION\"/}" Cargo.toml
          fi

      - name: Test
        shell: bash
        run: |
          # Windows PTY e2e tests need single-threaded execution because of
          # resource contention; the same override ci.yml applies.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo test --locked --target ${{ matrix.target }} -- --test-threads=1
          else
            cargo test --locked --target ${{ matrix.target }}
          fi

      - name: Build release binary
        env:
          NPM_CONFIG_INCLUDE: optional
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary + per-asset checksum
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          ASSET_PATH="${{ matrix.asset_name }}"
          # Use POSIX zip instead of Compress-Archive (PowerShell): it's
          # faster, deterministic across ubuntu/macos, and avoids pwsh as
          # a transient dependency.
          (cd "$(dirname "$BIN_PATH")" && zip -j "$GITHUB_WORKSPACE/$ASSET_PATH" "$BIN_PATH")
          sha256sum "$ASSET_PATH" > "$ASSET_PATH.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          # retention-days: 1 — the matrix only needs the artifact alive
          # for the fan-out publish jobs (seconds to minutes). Permanent
          # copies live on the GitHub release + crates.io + npmjs.
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          generate_release_notes: true
          # Prerelease tags publish as preview/beta releases, never as
          # "latest".
          prerelease: ${{ contains(env.EFFECTIVE_REF, '-') }}
          name: ${{ contains(env.EFFECTIVE_REF, '-') && format('{0} (beta)', env.EFFECTIVE_REF) || env.EFFECTIVE_REF }}

  attach-checksums:
    name: attach SHA256SUMS
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Explicit so the job holds only what it needs, regardless of what the
      # workflow-level default grants.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate per-asset checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat */*.sha256 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attach SHA256SUMS to release
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
          generate_release_notes: false

  update-homebrew-formula:
    name: update-homebrew-formula
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stable tags only: prereleases must not rewrite the Homebrew formula
    # that ships on the default branch.
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.tag, '-'))
    env:
      EFFECTIVE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update Formula/oly.rb
        env:
          VERSION: ${{ env.EFFECTIVE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          MACOS_SHA="$(awk '{print $1}' dist/oly-macos-arm64.zip.sha256)"
          LINUX_SHA="$(awk '{print $1}' dist/oly-linux-amd64.zip.sha256)"
          export VERSION MACOS_SHA LINUX_SHA

          ruby <<'RUBY'
          formula_path = "Formula/oly.rb"
          formula = File.read(formula_path)
          version = ENV.fetch("VERSION")
          macos_sha = ENV.fetch("MACOS_SHA")
          linux_sha = ENV.fetch("LINUX_SHA")

          formula.sub!(/^  version "[^"]+"/, %(  version "#{version}"))
          formula.sub!(/(on_macos do.*?sha256 ")([^"]+)(")/m, "\\1#{macos_sha}\\3")
          formula.sub!(/(on_linux do.*?sha256 ")([^"]+)(")/m, "\\1#{linux_sha}\\3")

          File.write(formula_path, formula)
          RUBY

      - name: Commit updated formula
        env:
          VERSION: ${{ env.EFFECTIVE_REF }}
        run: |
          VERSION="${VERSION#v}"
          if git diff --quiet -- Formula/oly.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/oly.rb
          # [skip ci] so the auto-commit doesn't queue the full CI matrix
          # just to confirm "yes the version bump matches the tag".
          git commit -m "chore(release): sync homebrew formula for ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  publish-crates:
    name: publish-crates
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stable tags only: crates.io has no dist-tags, so prereleases must
    # never reach the registry.
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.tag, '-'))
    env:
      EFFECTIVE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EFFECTIVE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${EFFECTIVE_REF#v}"
          CURRENT="$(grep -E '^version = "[^"]+"' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$CURRENT" != "$VERSION" ]; then
            sed -i -E "0,/^version = \"[^\"]+\"/{s//version = \"$VERSION\"/}" Cargo.toml
          fi

      # Registry publishes can flake on 5xx; retry the whole step.
      - name: Publish to crates.io
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          command: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: publish-npm
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EFFECTIVE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    # Most native binaries end up in npm/bin/, so run commands under
    # npm/ by default — including the retry step below.
    defaults:
      run:
        working-directory: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EFFECTIVE_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version + npm dist-tag
        id: meta
        env:
          REF: ${{ env.EFFECTIVE_REF }}
        run: |
          VERSION="${REF#v}"
          if [[ "$REF" == *-* ]]; then
            DIST_TAG="beta"
          else
            DIST_TAG="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set package.json version
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # npm registry publishes can flake under load; retry the whole step.
      - name: Bundle binaries + publish to npm
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          command: |
            set -euo pipefail
            # cwd is npm/ from defaults; artifact was downloaded to ../dist.
            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            LINUX_ZIP="$(find ../dist -type f -name 'oly-linux-amd64.zip' -print -quit)"
            MACOS_ZIP="$(find ../dist -type f -name 'oly-macos-arm64.zip' -print -quit)"
            WINDOWS_ZIP="$(find ../dist -type f -name 'oly-windows-amd64.zip' -print -quit)"

            test -n "$LINUX_ZIP"
            test -n "$MACOS_ZIP"
            test -n "$WINDOWS_ZIP"

            unzip -j "$LINUX_ZIP" oly -d "$TMP_DIR"
            mv "$TMP_DIR/oly" bin/oly-linux-x64
            unzip -j "$MACOS_ZIP" oly -d "$TMP_DIR"
            mv "$TMP_DIR/oly" bin/oly-darwin-arm64
            unzip -j "$WINDOWS_ZIP" oly.exe -d "$TMP_DIR"
            mv "$TMP_DIR/oly.exe" bin/oly-win32-x64.exe
            chmod +x bin/oly-linux-x64 bin/oly-darwin-arm64

            test -f bin/oly.js
            test -f bin/oly-linux-x64
            test -f bin/oly-darwin-arm64
            test -f bin/oly-win32-x64.exe

            cp ../README.md README.md

            npm publish --access public --tag "$DIST_TAG"

        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

