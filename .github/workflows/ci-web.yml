name: CI-WEB

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-web.yml
      - web/**
      # Trigger on dotfile/js config tweaks that web/** alone misses.
      - web/eslint.config.*
      - web/playwright.config.*
      - web/.prettierrc*
      - web/.editorconfig
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-web.yml
      - web/**
      # Trigger on dotfile/js config tweaks that web/** alone misses.
      - web/eslint.config.*
      - web/playwright.config.*
      - web/.prettierrc*
      - web/.editorconfig
  # Manual re-run for a flaky browser run or a workflow-only change.
  # Dispatch ignores filters.
  workflow_dispatch:

# Same concurrency policy as CI: cancel PR runs, never push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Most steps run inside web/, so make it the default working directory
# for `run:` commands. actions/setup-node still reads the cache key from
# the explicit cache-dependency-path below.
defaults:
  run:
    working-directory: web

jobs:
  lint:
    name: lint / format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps + Playwright browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # This job installs only the Chromium browser (see the step above), so it
      # must run only the Chromium project. The mobile-safari project needs
      # WebKit, which is a local opt-in (`--project=mobile-safari`); running it
      # here would fail with "Executable doesn't exist" for the WebKit binary.
      - name: Playwright e2e
        run: npm run e2e -- --project=chromium

  # The Rust workflow (ci.yml) deliberately lists no web/**, so this is where a
  # web change proves the release build still compiles the bundle into the
  # binary: build.rs runs `npm install` + `npm run build` for release profiles
  # and src/http/mod.rs embeds web/dist via rust-embed.
  embed:
    name: embed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same shared key as ci.yml so both workflows reuse one cache family.
      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-oly
          cache-on-failure: true

      # `defaults.run.working-directory` points at web/, but cargo runs at the
      # workspace root; build.rs runs the web build itself for release.
      - name: Build release with the embedded bundle
        working-directory: ${{ github.workspace }}
        run: cargo build --release --locked

      # Debug rust-embed reads the live dist tree and deliberately revalidates.
      # Only release tests exercise the compiled-in immutable asset inventory.
      - name: Check embedded static caching contracts
        working-directory: ${{ github.workspace }}
        run: cargo test --release --locked --bin oly http::static_files:: -- --test-threads=1
