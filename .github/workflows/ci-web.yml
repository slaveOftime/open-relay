name: CI-WEB

on:
  push:
    branches:
      - main
      # Long-lived preview/beta release line (0.5.x); main stays on 0.3.x.
      - v0.5.x
  pull_request:
    branches:
      - main
      - v0.5.x
    paths:
      - .github/workflows/ci-web.yml
      - web/**

permissions:
  contents: read

jobs:
  build-test:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm registry
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install
        run: |
          cd web
          npm ci

      - name: Lint
        run: |
          cd web
          npm run lint

      - name: Format check
        run: |
          cd web
          npm run format:check

      - name: Test
        run: |
          cd web
          npm test

      - name: Build
        run: |
          cd web
          npm run build

  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: |
          cd web
          npm run e2e
