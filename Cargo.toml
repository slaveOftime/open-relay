[package]
name = "oly"
version = "0.5.0"
edition = "2024"
description = "Run interactive CLIs and AI agents like managed services with persistent PTY sessions."
license = "MIT"
repository = "https://github.com/slaveOftime/open-relay"
homepage = "https://github.com/slaveOftime/open-relay"
keywords = ["cli", "agent", "pty", "terminal", "ai"]
categories = ["command-line-utilities", "asynchronous"]
readme = "README.md"
default-run = "oly"

[[bin]]
name = "oly"
path = "src/main.rs"

[[bin]]
name = "oly-session-review"
path = "hooks/session-review/main.rs"
required-features = ["session-review"]

[features]
default = []
session-review = ["dep:gpui", "dep:gpui-terminal"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
opt-level = "z"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "net", "sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
portable-pty = "0.9"
regex = "1"
memchr = "2"
notify-rust = "4.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6.0"
thiserror = "2.0"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
# 1.0 terminal engine (ADR-0001): non-destructive reflow resize, exact
# query-position events, serializable grids for checkpoints. M6-1 retired
# the second parser: vt100 is a dev-only differential oracle now.
alacritty_terminal = { version = "0.26.0", features = ["serde"] }
which = "8.0.6"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.7", features = ["cors", "compression-br", "compression-gzip"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
rust-embed = "8"
mime_guess = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
ed25519-dalek = { version = "3", features = ["batch"] }
rand = "0.10"
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
argon2 = "0.6"
rpassword = "7.5"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
ssh-key = "0.7.0-rc.11"
bytes = "1"
arc-swap = "1.9.2"
parking_lot = "0.12"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gpui = { version = "0.2.2", optional = true }
gpui-terminal = { version = "0.1.0", optional = true }
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }

[dev-dependencies]
# Test-only differential oracle (M6-1): engine conformance and renderer
# tests validate against vt100; it is never compiled into the binary.
vt100 = "0.16.2"

[target.'cfg(not(windows))'.dev-dependencies]
# PTY harness for driving `oly attach` itself in e2e tests (the main
# dependency is reused; Windows attach rendering is a separate path).
portable-pty = "0.9"

[target.'cfg(not(windows))'.dependencies]
mimalloc = { version = "0.1.52" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Clippy baseline (M6 review hardening): the gate is
# `cargo clippy --locked --all-targets --all-features -- -D warnings`.
# The allowances below are the deliberate, documented exceptions; every
# other lint must stay clean.
[lints.clippy]
# The session store's `std::sync::Mutex` guards deliberately span `.await`
# points: the store's locking discipline protects in-memory subscriber
# registries while awaiting channel sends that can never re-enter the same
# lock on the same task. Switching to async mutexes would widen, not
# narrow, the hold windows.
await_holding_lock = "allow"
# Long-lived plumbing functions (RPC dispatch, log rendering) thread many
# orthogonal parameters; a parameter-object refactor is not worth the
# indirection at these two sites.
too_many_arguments = "allow"
# Subscriber registries store per-subscriber senders keyed by compound
# cursors; the types are structural, not domain concepts worth naming.
type_complexity = "allow"
# `RpcResponse` has one large attach-snapshot variant; boxing it would add
# an allocation to the hottest attach path for no runtime win.
large_enum_variant = "allow"
# Session-scoped protocol types share the `Session` prefix on purpose;
# renaming them would diverge from the protocol documentation.
enum_variant_names = "allow"
