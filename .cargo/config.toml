# Avoid requiring the Visual C++ runtime DLLs (e.g. VCRUNTIME140.dll)
# by statically linking the MSVC CRT for Windows targets.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

# Windows PTY e2e tests have resource contention with parallel execution.
# When running locally, use: cargo test --test e2e_pty -- --test-threads=1
[alias]
test-full = "test --test cli_errors --test e2e_csvlens --test e2e_daemon --test e2e_pty -- --test-threads=1"
test-pty = "test --test e2e_pty -- --test-threads=1"